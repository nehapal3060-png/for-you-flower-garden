<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050806">
<title>Garden</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="scene" id="scene">
  <div class="letter-screen" id="letterScreen" aria-label="Open your envelope">
    <div class="envelope-wrap" id="envelopeWrap" role="button" tabindex="0" aria-label="Click to open">
      <div class="envelope">
        <div class="envelope-back"></div>
        <div class="envelope-paper"><span>For You</span></div>
        <div class="envelope-front"></div>
        <div class="envelope-flap"></div>
        <div class="seal">♡</div>
      </div>
      <div class="open-hint">Click to open</div>
    </div>
    <div class="for-you" id="forYou">For You</div>
  </div>
  <div class="moon"></div>
  <div class="sky-glow"></div>
  <div class="stars" id="stars"></div>
  <div class="dust" id="dust"></div>
  <div class="petal-drift" id="petalDrift"></div>

  <section class="garden" id="garden" aria-hidden="false">
    <div class="back-haze"></div>
    <div class="hill hill-far"></div>
    <div class="hill hill-a"></div>
    <div class="hill hill-b"></div>
    <div class="grass-back" id="grassBack"></div>
    <div class="flowers" id="flowers"></div>
    <div class="grass-front" id="grassFront"></div>
    <div class="fireflies" id="fireflies"></div>
  </section>

  <audio id="bgMusic" src="phir-le-aya-dil-reprise.mp3" preload="auto" loop></audio>
  <button class="music" id="music" aria-label="Pause music" aria-pressed="true">♫</button>
</main>
<script src="script.js"></script>
</body>
</html>
